[project]
name = "whisperx-local"
version = "0.2.0"
description = "Local, observable transcription for Persian and English meetings"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "rich>=13.9,<16",
    "whisperx==3.8.6",
]

[project.scripts]
whisperx-local = "whisperx_local.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisperx_local"]
