name: Ubuntu

on:
  push:
  pull_request:

jobs:
  test:
    name: Ubuntu ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install application
        run: ./cli install
      - name: Verify architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: .venv/bin/python -c "import os; from whisperx_local.paths import host_architecture, supported_host; assert supported_host() and host_architecture() == os.environ['EXPECTED_ARCHITECTURE']"
      - name: Run tests
        run: ./cli selftest